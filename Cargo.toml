[package]
name = "future-slot"
version = "0.2.0"
edition = "2024"
authors = ["Aspen Pratt <fuzzyzilla01@gmail.com>"]
description = "A no-std no-alloc `Box<dyn Future>` analogue"
keywords = ["no-std", "no-alloc", "future", "async", "pin"]
categories = ["embedded", "asynchronous", "no-std", "no-std::no-alloc"]
repository = "https://github.com/Fuzzyzilla/future-slot"
license = "MIT"
exclude = ["logo.png"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
